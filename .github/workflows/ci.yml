---
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Run yamllint
        run: yamllint .
