---
# Declarative inventory of every VM on the platform.
# Adding an entry provisions it; removing one destroys it.
#
# vlan: chosen by requester
# node: chosen by platform for now.
# ipv4: allocated by hand from the sheet for now.
vms:
  - name: demo-01
    owner: phd-01
    purpose: "First Terraform provisioned VM"
    vlan: sboai
    node: framboise
    vm_id: 9200
    cores: 2
    memory_mb: 4096
    disk_gb: 40
    ipv4: 172.21.18.95/22
    expires: "2026-12-31"
  - name: demo-02
    owner: phd-02
    purpose: "Testing placement validation"
